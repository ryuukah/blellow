<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friend Request</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="window">

    <!-- Top title bar -->
    <div class="title-bar">
      <div class="heart">♡</div>

      <div class="window-buttons">
        <button class="window-button minimize">—</button>
        <button class="window-button maximize">□</button>
        <button class="window-button close">×</button>
      </div>
    </div>

    <!-- Main window -->
    <div class="window-content">

      <!-- Pink header -->
      <div class="header">

        <div class="request-title">
          Friend Request
        </div>

        <div class="search-box">
          <span>⌕</span>
        </div>

      </div>

      <!-- Main content -->
      <div class="main-content">

        <div class="profile">

          <div class="avatar">
            <div class="avatar-head"></div>
            <div class="avatar-body"></div>
          </div>

          <span>dequu.jpg</span>

        </div>

        <div class="message" id="message">

          <p>( ♥ ) &nbsp; graphic designer</p>
          <p>(99%) interests match</p>

        </div>

        <div class="buttons">

          <button id="acceptBtn" class="action accept">
            accept &lt;3
          </button>

          <button id="declineBtn" class="action decline">
            decline :(
          </button>

        </div>

      </div>

      <!-- Pink bottom -->
      <div class="bottom-bar"></div>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
