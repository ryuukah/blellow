<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friend Request</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="window">

    <!-- TOP WINDOW BAR -->
    <div class="title-bar">

      <div class="heart">♡</div>

      <div class="window-buttons">
        <button class="window-button minimize">—</button>
        <button class="window-button maximize">□</button>
        <button class="window-button close">×</button>
      </div>

    </div>

    <div class="window-content">

      <!-- HEADER -->
      <div class="header">

        <div class="request-title">
          Friend Request
        </div>

        <div class="search-box">
          <span>⌕</span>
        </div>

      </div>

      <!-- MAIN -->
      <div class="main-content">

        <!-- USER BADGE -->
        <div class="profile">

          <div class="avatar">
            <img
              src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3CradialGradient id='head' cx='35%25' cy='25%25'%3E%3Cstop offset='0' stop-color='%23fff1fa'/%3E%3Cstop offset='.35' stop-color='%23ffb8dc'/%3E%3Cstop offset='1' stop-color='%23e84f9e'/%3E%3C/radialGradient%3E%3CradialGradient id='body' cx='35%25' cy='15%25'%3E%3Cstop offset='0' stop-color='%23ffeaf6'/%3E%3Cstop offset='.4' stop-color='%23ff9dcc'/%3E%3Cstop offset='1' stop-color='%23e44b9b'/%3E%3C/radialGradient%3E%3ClinearGradient id='shine' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop stop-color='white' stop-opacity='.75'/%3E%3Cstop offset='.45' stop-color='white' stop-opacity='.08'/%3E%3Cstop offset='1' stop-color='white' stop-opacity='0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cellipse cx='50' cy='75' rx='34' ry='22' fill='url(%23body)' stroke='%23c83c89' stroke-width='2'/%3E%3Ccircle cx='50' cy='35' r='19' fill='url(%23head)' stroke='%23c83c89' stroke-width='2'/%3E%3Cellipse cx='44' cy='27' rx='10' ry='6' fill='white' opacity='.55'/%3E%3Cpath d='M20 77 Q50 55 80 77 L80 88 Q50 68 20 88Z' fill='url(%23shine)' opacity='.55'/%3E%3C/svg%3E"
              alt="dequu avatar"
            >
          </div>

          <span>dequu.png</span>

        </div>

        <!-- MESSAGE -->
        <div class="message" id="message">

          <p>( ♥ ) &nbsp; graphic designer</p>
          <p>(99%) interests match</p>

        </div>

        <!-- BUTTONS -->
        <div class="buttons">

          <button id="acceptBtn" class="action accept">
            accept &lt;3
          </button>

          <button id="declineBtn" class="action decline">
            decline :(
          </button>

        </div>

      </div>

      <!-- BOTTOM PINK -->
      <div class="bottom-bar"></div>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
